spring:
  application:
    name: backend

  # 开启虚拟线程:SSE 流式对话会长时间挂住一个请求,虚拟线程更省资源
  threads:
    virtual:
      enabled: true

  # MySQL(Docker,root/123456,库 testdb)
  datasource:
    url: jdbc:mysql://localhost:3306/grindset?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis(Docker,无密码)
  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:grindset}
    password: ${RABBITMQ_PASSWORD:grindset123}
    virtual-host: ${RABBITMQ_VHOST:/grindset}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 2
        max-concurrency: 4

  # 简历上传限制:单文件 10MB,整个请求留一点余量
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8081

# MyBatis-Plus:下划线表名/字段自动映射驼峰
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: null

# JWT 配置(密钥生产环境应放环境变量,这里 MVP 先写死占位)
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-make-it-long-enough-32bytes}
    access-ttl-minutes: 30
    refresh-ttl-days: 7
    # refresh Cookie 是否只在 https 下发;本地 http 开发必须 false
    cookie-secure: ${JWT_COOKIE_SECURE:false}
    # 同站部署用 Lax;前后端不同站用 None 且必须 cookie-secure=true
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}

  # 第三方登录(GitHub / Google)的通用流程参数。
  # 客户端凭证不在配置文件里,统一存放在 oauth_client_config 表,client_secret 加密存储。
  oauth:
    # state 有效期(分钟),防 CSRF,一次即废
    state-ttl-minutes: 5
    # 一次性 code 有效期(秒),给前端换 accessToken
    code-ttl-seconds: 60

  # 管理接口令牌:未配置时 /api/admin/** 全部停用(403),避免裸奔
  admin:
    token: ${ADMIN_TOKEN:}

  # 大模型服务。
  # 渠道(地址/名称)和模型目录已迁到数据库 llm_channels / llm_models,
  # 这里只放密钥(环境变量注入)和全局参数。没配 key 的厂商不会出现在前端下拉框。
  llm:
    system-prompt: "你是 Grindset 的面试复习助手,用中文回答,简洁准确、条理清晰;讲题时先给思路要点再补充细节。"
    max-history-messages: 20
    api-keys:
      deepseek: ${DEEPSEEK_API_KEY:}
      qwen: ${DASHSCOPE_API_KEY:}
      zhipu: ${ZHIPU_API_KEY:}
      minimax: ${MINIMAX_API_KEY:}
      doubao: ${ARK_API_KEY:}

  # 加密数据库里所有敏感凭证(LLM API Key / OAuth client_secret / OSS AccessKey)的主密钥。
  # 换掉会导致已存密文全部解不开,生产务必固定配置。
  secrets:
    master-key: ${SECRET_MASTER_KEY:}

  # 简历解析用哪组模型:两项都配就固定使用,都不配则取第一个可用厂商的第一个模型
  resume:
    llm:
      provider: ${RESUME_LLM_PROVIDER:}
      model: ${RESUME_LLM_MODEL:}
    # 解析 worker 角色:api 实例设 false,worker 实例设 true。
    # 默认 true,方便本地单进程同时收上传和消费消息。
    worker:
      enabled: ${WORKER_ENABLED:true}
    parse:
      # 上传入口允许的最大并发解析任务数(单实例)
      upload-permits: ${RESUME_UPLOAD_PERMITS:8}
      # 补偿任务扫描间隔(毫秒)
      reconcile-ms: ${RESUME_PARSE_RECONCILE_MS:300000}
      # 超过这个分钟数仍为解析中,视为卡住
      stuck-minutes: ${RESUME_PARSE_STUCK_MINUTES:10}
      # 最大执行次数:首次 + 3 次重试(30s / 2m / 10m)
      max-attempts: ${RESUME_PARSE_MAX_ATTEMPTS:4}
      # 单份简历解析锁的 TTL;要大于一次解析的最长耗时
      lock-ttl-minutes: ${RESUME_PARSE_LOCK_TTL_MINUTES:10}
    # 简历原件存储(阿里云 OSS 私有桶)。正式环境建议通过 /api/admin/storage/oss 写入数据库,
    # 这里的环境变量只作为本地开发兜底;两项都没有时自动跳过原件存储,不影响解析。
    oss:
      endpoint: ${ALIYUN_OSS_ENDPOINT:}
      bucket: ${ALIYUN_OSS_BUCKET:}
      access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
      dir-prefix: ${ALIYUN_OSS_RESUME_PREFIX:resumes}
      url-expire-seconds: ${ALIYUN_OSS_URL_EXPIRE_SECONDS:3600}

  # AI 面试用哪组模型,规则同上
  interview:
    llm:
      provider: ${INTERVIEW_LLM_PROVIDER:}
      model: ${INTERVIEW_LLM_MODEL:}

  # 语音识别(豆包/火山引擎流式 ASR)。
  # api-key 只在后端使用;浏览器带自己的 access token 连 /api/asr/stream,
  # 由后端代为连接火山引擎。没有配置 api-key 时连接会返回明确错误。
  asr:
    enabled: ${ASR_ENABLED:true}
    volcengine:
      endpoint: ${VOLC_ASR_ENDPOINT:wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_async}
      api-key: ${VOLC_ASR_API_KEY:}
      # 豆包流式语音识别模型 2.0 小时版;并发版是 volc.seedasr.sauc.concurrent
      resource-id: ${VOLC_ASR_RESOURCE_ID:volc.seedasr.sauc.duration}
      connect-timeout-seconds: ${VOLC_ASR_CONNECT_TIMEOUT_SECONDS:10}
    session:
      # 单次识别默认时长(秒),调用方可用 ?maxSeconds= 覆盖
      default-max-seconds: ${ASR_DEFAULT_MAX_SECONDS:60}
      # 服务端硬上限(秒),防止长录音产生不可控费用
      hard-max-seconds: ${ASR_HARD_MAX_SECONDS:300}
      # 单次会话音频字节上限,默认 10MB(16k/16bit 约 5 分钟)
      max-audio-bytes: ${ASR_MAX_AUDIO_BYTES:10485760}

  # 语音合成(豆包语音合成,HTTP 单向流式)。未配置 key 时前端自动关闭播报。
  tts:
    enabled: ${TTS_ENABLED:true}
    api-key: ${VOLC_TTS_API_KEY:${VOLC_ASR_API_KEY:}}
    resource-id: ${VOLC_TTS_RESOURCE_ID:seed-tts-2.0}
    # 音色 ID 见控制台音色库;默认通用女声
    speaker: ${VOLC_TTS_SPEAKER:zh_female_vv_uranus_bigtts}
    endpoint: ${VOLC_TTS_ENDPOINT:https://openspeech.bytedance.com/api/v3/tts/unidirectional/sse}
    timeout-seconds: ${VOLC_TTS_TIMEOUT_SECONDS:60}

  # 判题沙箱镜像。国内网络可先按镜像站地址拉取,例如:
  #   docker pull docker.m.daocloud.io/library/eclipse-temurin:21-jdk-alpine
  #   docker tag  docker.m.daocloud.io/library/eclipse-temurin:21-jdk-alpine eclipse-temurin:21-jdk-alpine
  # 再把下面的镜像名改成实际存在的那个(也可以是镜像站全名)。
  judge:
    java-image: ${JUDGE_JAVA_IMAGE:eclipse-temurin:21-jdk-alpine}
    python-image: ${JUDGE_PYTHON_IMAGE:python:3.12-slim}
