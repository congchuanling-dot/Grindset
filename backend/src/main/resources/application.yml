spring:
  application:
    name: backend

  # 开启虚拟线程:SSE 流式对话会长时间挂住一个请求,虚拟线程更省资源
  threads:
    virtual:
      enabled: true

  # MySQL(Docker,root/123456,库 testdb)
  datasource:
    url: jdbc:mysql://localhost:3306/grindset?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis(Docker,无密码)
  data:
    redis:
      host: localhost
      port: 6379

  # 简历上传限制:单文件 10MB,整个请求留一点余量
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8081

# MyBatis-Plus:下划线表名/字段自动映射驼峰
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: null

# JWT 配置(密钥生产环境应放环境变量,这里 MVP 先写死占位)
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-make-it-long-enough-32bytes}
    access-ttl-minutes: 30
    refresh-ttl-days: 7
    # refresh Cookie 是否只在 https 下发;本地 http 开发必须 false
    cookie-secure: ${JWT_COOKIE_SECURE:false}
    # 同站部署用 Lax;前后端不同站用 None 且必须 cookie-secure=true
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}

  # GitHub 登录(OAuth)。当前使用 GitHub App 的 OAuth 凭证:
  # Client ID 在 App 设置页可见,Client Secret 需点"Generate a new client secret"生成。
  # Secret 只允许走环境变量,不要写进仓库。
  oauth:
    github:
      # 凭证只允许走环境变量,禁止写进仓库
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      # 必须与 GitHub App 后台注册的 Redirect URI 逐字符一致
      redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8081/api/auth/github/callback}
      # 后端回调处理完 302 到这里,前端用 ?code= 换 accessToken
      frontend-callback-uri: ${GITHUB_FRONTEND_CALLBACK:http://localhost:5173/auth/callback}
      # state 有效期(分钟),防 CSRF,一次即废
      state-ttl-minutes: 5
      # 一次性 code 有效期(秒),给前端换 accessToken
      code-ttl-seconds: 60

    # Google 登录(OAuth 2.0),回调地址需在 Google Cloud Console 的
    # Authorized redirect URIs 中登记,并确保 OAuth consent screen 的 Test users 包含登录账号。
    google:
      # 凭证只允许走环境变量,禁止写进仓库
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8081/api/auth/google/callback}
      frontend-callback-uri: ${GOOGLE_FRONTEND_CALLBACK:http://localhost:5173/auth/callback}
      state-ttl-minutes: 5
      code-ttl-seconds: 60

  # 管理接口令牌:未配置时 /api/admin/** 全部停用(403),避免裸奔
  admin:
    token: ${ADMIN_TOKEN:}

  # 大模型服务。
  # 渠道(地址/名称)和模型目录已迁到数据库 llm_channels / llm_models,
  # 这里只放密钥(环境变量注入)和全局参数。没配 key 的厂商不会出现在前端下拉框。
  llm:
    system-prompt: "你是 Grindset 的面试复习助手,用中文回答,简洁准确、条理清晰;讲题时先给思路要点再补充细节。"
    max-history-messages: 20
    # 加密库里 API Key 的主密钥:换掉会导致已存的 key 全部解不开,生产务必固定配置
    master-key: ${LLM_MASTER_KEY:}
    api-keys:
      deepseek: ${DEEPSEEK_API_KEY:}
      qwen: ${DASHSCOPE_API_KEY:}
      zhipu: ${ZHIPU_API_KEY:}
      minimax: ${MINIMAX_API_KEY:}
      doubao: ${ARK_API_KEY:}

  # 简历解析用哪组模型:两项都配就固定使用,都不配则取第一个可用厂商的第一个模型
  resume:
    llm:
      provider: ${RESUME_LLM_PROVIDER:}
      model: ${RESUME_LLM_MODEL:}

  # AI 面试用哪组模型,规则同上
  interview:
    llm:
      provider: ${INTERVIEW_LLM_PROVIDER:}
      model: ${INTERVIEW_LLM_MODEL:}

  # 判题沙箱镜像。国内网络可先按镜像站地址拉取,例如:
  #   docker pull docker.m.daocloud.io/library/eclipse-temurin:21-jdk-alpine
  #   docker tag  docker.m.daocloud.io/library/eclipse-temurin:21-jdk-alpine eclipse-temurin:21-jdk-alpine
  # 再把下面的镜像名改成实际存在的那个(也可以是镜像站全名)。
  judge:
    java-image: ${JUDGE_JAVA_IMAGE:eclipse-temurin:21-jdk-alpine}
    python-image: ${JUDGE_PYTHON_IMAGE:python:3.12-slim}
